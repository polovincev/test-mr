services:
- type: web
  name: test-mr
  runtime: python
  plan: free
  region: oregon
  rootDir: backend
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  autoDeployTrigger: commit
  envVars:
    - key: OPENAI_API_KEY
      sync: false

- type: web
  name: test-mr-fr
  runtime: static
  envVars:
    - key: VITE_API_URL
      value: https://test-mr-3aty.onrender.com
  buildCommand: npm install && npm run build
  staticPublishPath: dist
  autoDeployTrigger: commit
  rootDir: frontend
version: "1"